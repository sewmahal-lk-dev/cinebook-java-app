<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBook - Premium Movie Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.85)),
                        url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1920') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            color: #E50914;
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        header p {
            color: #ccc;
            font-size: 1.1rem;
        }

        .movie-form, .movie-card {
            background-color: rgba(31, 31, 31, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .movie-form h2 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #E50914;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            background-color: #222;
            color: white;
            border-radius: 4px;
            font-size: 1rem;
        }

        .btn {
            background-color: #E50914;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #b81d24;
        }

        /* Search Section */
        .search-container {
            margin-bottom: 30px;
        }
        .search-container input {
            width: 100%;
            padding: 15px;
            border-radius: 25px;
            border: 1px solid #E50914;
            background-color: rgba(0,0,0,0.6);
            color: white;
            font-size: 1.1rem;
            text-align: center;
        }

        /* Movie Grid & Cards */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .movie-card {
            padding: 20px;
            border-left: 5px solid #E50914;
            position: relative;
            margin-bottom: 0;
        }

        .movie-card h3 {
            margin-bottom: 10px;
            font-size: 1.4rem;
        }

        .movie-card p {
            color: #aaa;
        }

        /* Delete Button Style */
        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #ff4444;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .delete-btn:hover {
            color: #ff0000;
            transform: scale(1.2);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎬 CineBook Premium</h1>
        <p>Your Ultimate Personal Movie Management Portal</p>
    </header>

    <div class="movie-form">
        <h2>Add New Movie</h2>
        <div class="form-group">
            <label for="title">Movie Title</label>
            <input type="text" id="title" placeholder="e.g., Inception">
        </div>
        <div class="form-group">
            <label for="genre">Genre</label>
            <select id="genre">
                <option value="Action">Action</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Horror">Horror</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Romance">Romance</option>
            </select>
        </div>
        <button class="btn" onclick="addMovie()">Add Movie</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchBar" onkeyup="filterMovies()" placeholder="🔍 Type movie title to search...">
    </div>

    <h2>🎬 Available Movies</h2>
    <br>
    <div class="movie-grid" id="movieGrid"></div>
</div>

<script>
    const API_URL = "http://localhost:8080/api/movies";
    let allMoviesList = [];

    document.addEventListener("DOMContentLoaded", loadMovies);

    // 1. Load Movies
    async function loadMovies() {
        try {
            const response = await fetch(API_URL);
            allMoviesList = await response.json();
            displayMovies(allMoviesList);
        } catch (error) {
            console.error("Error loading movies:", error);
        }
    }

    function displayMovies(movies) {
        const movieGrid = document.getElementById("movieGrid");
        movieGrid.innerHTML = "";

        if(movies.length === 0) {
            movieGrid.innerHTML = "<p>No movies found!</p>";
            return;
        }

        movies.forEach(movie => {
            const card = document.createElement("div");
            card.className = "movie-card";
            card.innerHTML = `
                <h3>${movie.title}</h3>
                <p>🍿 Genre: ${movie.genre}</p>
                <p style="font-size: 11px; color: #555; margin-top: 10px;">ID: ${movie.id}</p>
                <button class="delete-btn" onclick="deleteMovie(${movie.id})">🗑</button>
            `;
            movieGrid.appendChild(card);
        });
    }

    // 2. Add Movie
    async function addMovie() {
        const titleInput = document.getElementById("title");
        const genreSelect = document.getElementById("genre");

        const title = titleInput.value.trim();
        const genre = genreSelect.value;

        if (title === "") {
            alert("Please enter a movie title!");
            return;
        }

        const newMovie = { title: title, genre: genre };

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(newMovie)
            });

            if (response.ok) {
                titleInput.value = "";
                loadMovies();
            }
        } catch (error) {
            console.error("Error adding movie:", error);
        }
    }

    // 3. Delete Movie
    async function deleteMovie(id) {
        if(confirm("Are you sure you want to delete this movie?")) {
            try {
                const response = await fetch(`${API_URL}?id=${id}`, {
                    method: "DELETE"
                });

                if (response.ok) {
                    loadMovies();
                }
            } catch (error) {
                console.error("Error deleting movie:", error);
            }
        }
    }

    // 4. Live Search Feature
    function filterMovies() {
        const searchText = document.getElementById("searchBar").value.toLowerCase();
        const filtered = allMoviesList.filter(movie =>
            movie.title.toLowerCase().includes(searchText)
        );
        displayMovies(filtered);
    }
</script>

</body>
</html>
